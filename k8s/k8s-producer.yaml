apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-producer-deployment
  labels:
    app: queue-producer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: queue-producer
  template:
    metadata:
      labels:
        app: queue-producer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: producer
          image: hduc2412/go-queue-app:v1
          imagePullPolicy: Always
          command: ["./producer-app"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_ADDR
              value: "redis-service:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: queue-producer-service
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: queue-producer
