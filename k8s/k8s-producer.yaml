apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-producer-deployment
  labels:
    app: queue-producer
spec:
  replicas: 2 # 2 Pod if 1 Pod die, API system (High Availability)
  selector:
    matchLabels:
      app: queue-producer
  template:
    metadata:
      labels:
        app: queue-producer
    spec:
      containers:
      - name: producer
        image: hduc2412/go-queue-app:v1 
        command: ["./producer-app"]          
        ports:
        - containerPort: 8080
        env:
        - name: REDIS_ADDR
          value: "redis-service:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: queue-producer-service
spec:
  type: LoadBalancer # Create IP public to calling from Postman
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: queue-producer