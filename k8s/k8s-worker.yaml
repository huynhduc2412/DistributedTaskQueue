apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker-deployment
  labels:
    app: queue-worker
spec:
  selector:
    matchLabels:
      app: queue-worker
  template:
    metadata:
      labels:
        app: queue-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8082"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: hduc2412/go-queue-app:v1
          imagePullPolicy: Always
          command: ["./worker-app"]
          ports:
            - name: metrics
              containerPort: 8082
          env:
            - name: REDIS_ADDR
              value: "redis-service:6379"
            - name: MYSQL_DSN
              value: "root:root@tcp(mysql-service:3306)/queue?parseTime=true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
